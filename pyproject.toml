[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-rag"
version = "0.1.0"
description = "A multi-language codebase question-answering RAG assistant."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain-core>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "rank-bm25>=0.2.2,<0.3",
    "tree-sitter-language-pack>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.setuptools]
packages = [
    "src",
    "src.generation",
    "src.indexing",
    "src.ingestion",
    "src.retrieval",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
